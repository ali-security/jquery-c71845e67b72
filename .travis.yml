dist: focal
language: node_js

# jobs.include REPLACES the top-level node_js matrix, so every job is listed
# here explicitly.
#
# The live npm registry has drifted past what node 0.10/0.11 can install
# (jsdom 1.5.0's native contextify dependency no longer builds as resolved
# today), so the node 0.x installs resolve against the npm time machine as of
# the 2.1.3 release (2014-12-18). contextify is a native addon and npm 2's
# node-gyp needs Python 2.
jobs:
  include:
    - name: "node 0.10: npm test (grunt: lint, build, uglify, node-smoke-test)"
      node_js: '0.10'
      addons:
        apt:
          packages:
            - python2
      install:
        - echo "registry=https://time-machines-npm.sealsecurity.io/" > /tmp/timemachine.npmrc
        - echo "//time-machines-npm.sealsecurity.io/:_authToken=2014-12-18T15:18:38.205Z" >> /tmp/timemachine.npmrc
        - echo "always-auth=true" >> /tmp/timemachine.npmrc
        - node --version
        - npm --version
        - npm install --userconfig /tmp/timemachine.npmrc --python=/usr/bin/python2
      script:
        - npm test
      # Hold the job until Travis has archived this log through the grunt
      # result (see test/seal-wait-for-log.sh); cannot change the job result.
      after_script:
        - sh test/seal-wait-for-log.sh grunt

    # 0.11.14 is the node the 2.1.3 release was published with. The newer
    # 0.11.16 (what '0.11' resolves to) changed the V8 API and contextify
    # 0.1.x no longer compiles. Its bundled npm 2.0.0 also refuses the time
    # machine's registry.npmjs.org tarball URLs under always-auth, so move it
    # to npm 2.15.1 (the node 0.10 leg's npm) first.
    - name: "node 0.11.14: npm test (grunt: lint, build, uglify, node-smoke-test)"
      node_js: '0.11.14'
      addons:
        apt:
          packages:
            - python2
      install:
        - npm install -g npm@2.15.1
        - echo "registry=https://time-machines-npm.sealsecurity.io/" > /tmp/timemachine.npmrc
        - echo "//time-machines-npm.sealsecurity.io/:_authToken=2014-12-18T15:18:38.205Z" >> /tmp/timemachine.npmrc
        - echo "always-auth=true" >> /tmp/timemachine.npmrc
        - node --version
        - npm --version
        - npm install --userconfig /tmp/timemachine.npmrc --python=/usr/bin/python2
      script:
        - npm test
      # Hold the job until Travis has archived this log through the grunt
      # result (see test/seal-wait-for-log.sh); cannot change the job result.
      after_script:
        - sh test/seal-wait-for-log.sh grunt

    # The project's real unit suite is the browser-only QUnit suite
    # (test/index.html; upstream ran it on TestSwarm). Build dist/ with the
    # release toolchain (node 0.10, full grunt default task), then run the
    # suite against the unminified dist/jquery.js (?dev; the default is
    # dist/jquery.min.js) in headless Chrome, served by PHP for the ajax
    # fixtures under test/data/*.php.
    - name: "QUnit unit suite (headless Chrome, dist/jquery.js built on node 0.10)"
      node_js: '20'
      addons:
        chrome: stable
        apt:
          packages:
            - python2
      install:
        - nvm install 0.10
        - nvm use 0.10
        - echo "registry=https://time-machines-npm.sealsecurity.io/" > /tmp/timemachine.npmrc
        - echo "//time-machines-npm.sealsecurity.io/:_authToken=2014-12-18T15:18:38.205Z" >> /tmp/timemachine.npmrc
        - echo "always-auth=true" >> /tmp/timemachine.npmrc
        - npm install --userconfig /tmp/timemachine.npmrc --python=/usr/bin/python2
        - ./node_modules/.bin/grunt
        - nvm use 20
        - node --version
        # Driver lives in its own tree so npm 10 never touches jQuery's
        # node 0.10 install.
        - mkdir -p /tmp/driver
        - cd /tmp/driver && npm init -y && npm install puppeteer-core && cd "$TRAVIS_BUILD_DIR"
        - google-chrome --version
        - php --version
      script:
        # Multiple workers are load-bearing: single-process php -S serializes
        # requests and starves the fixture iframes the suite opens.
        - PHP_CLI_SERVER_WORKERS=10 php -S 127.0.0.1:8000 -t . > /tmp/php.log 2>&1 &
        - for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8000/test/index.html && break; sleep 1; done
        - curl -sf -o /dev/null http://127.0.0.1:8000/test/index.html
        # Exclusions (environment-dependent in modern headless Chrome, not
        # jQuery defects; both deterministic):
        # - ajax #14379 fires a synchronous XHR from a window unload handler;
        #   Chrome forbids sync XHR during page dismissal, so it never sends.
        # - offset fractions: Blink snaps layout to 1/64 px, so the offset
        #   reads back 999.984375 instead of 1000.
        - >-
          SEAL_SKIP_TESTS="ajax: #14379 - jQuery.ajax() on unload =>
          environment-dependent: modern headless Chrome forbids synchronous XHR during page
          dismissal, so the request from the unload handler is never sent||
          offset: fractions (see #7730 and #7885) =>
          environment-dependent: Blink snaps layout to 1/64 px, so the offset reads back
          999.984375 instead of 1000"
          NODE_PATH=/tmp/driver/node_modules
          CHROME_PATH="$(which google-chrome)"
          node test/seal-browser-runner.js "http://127.0.0.1:8000/test/index.html?dev"
      # Hold the job until Travis has archived this log through the QUnit
      # summary (see test/seal-wait-for-log.sh); cannot change the job result.
      after_script:
        - sh test/seal-wait-for-log.sh qunit
